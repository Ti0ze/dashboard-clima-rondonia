<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dashboard interativo com o clima das cidades de Rondônia e uma lista de tarefas.">
  <title>Dashboard de Clima de Rondônia</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="weather-bg" aria-hidden="true">
    <div class="clouds"><i></i><i></i><i></i></div>
    <div class="rain">
      <div class="drops"></div>
      <div class="drops drops-big"></div>
      <div class="runs"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="flash"></div>
  </div>

  <header class="topbar">
    <h1>Dashboard de Clima de Rondônia</h1>
    <button id="theme-toggle" class="btn" type="button" aria-pressed="false">Tema escuro</button>
  </header>

  <main class="grid">

    <div class="coluna">

    <section id="weather" class="card" aria-labelledby="weather-title">
      <h2 id="weather-title">Clima</h2>
      <label for="city-select">Cidade</label>
      <select id="city-select"></select>

      <p id="weather-status" role="status" aria-live="polite"></p>

      <div class="tabs" role="tablist" aria-label="Período da previsão">
        <button id="tab-hoje" class="tab" role="tab" type="button" aria-selected="true" aria-controls="weather-current">Hoje</button>
        <button id="tab-dias" class="tab" role="tab" type="button" aria-selected="false" aria-controls="weather-forecast" tabindex="-1">Próximos dias</button>
      </div>

      <div id="weather-current" role="tabpanel" aria-labelledby="tab-hoje"></div>
      <!-- Previsão dos próximos 7 dias -->
      <div id="weather-forecast" role="tabpanel" aria-labelledby="tab-dias" hidden></div>
    </section>

    <section id="chart" class="card" aria-labelledby="chart-title">
      <h2 id="chart-title">Temperatura nos próximos 7 dias</h2>
      <ul class="legenda">
        <li class="max">Máxima</li>
        <li class="min">Mínima</li>
      </ul>

      <div id="chart-box"></div>
    </section>

    </div>

    <section id="tasks" class="card" aria-labelledby="tasks-title">
      <h2 id="tasks-title">Tarefas</h2>
      <form id="task-form">
        <label for="task-input">Nova tarefa</label>
        <input id="task-input" type="text" autocomplete="off" required>
        <button class="btn" type="submit">Adicionar tarefa</button>
      </form>
      <ul id="task-list"></ul>
    </section>

  </main>

  <footer class="footer">

    <p id="data-source"></p>
  </footer>

  <noscript>Este painel precisa de JavaScript para funcionar.</noscript>

  <script src="js/theme.js" defer></script>
  <script src="js/todo.js" defer></script>
  <script src="js/api.js" defer></script>
</body>
</html>
